    income_ceiling: 4500
    effective_from: "2024-08-20"
    source_url: "https://www.hdb.gov.sg"
    confirmed_by: 'HDB PDF "EHG amount Singles" (page 1 of 3) and HDB "Enhanced CPF Housing Grant for Singles" page (last updated 20 Aug 2026); checked 24 Oct 2026'
    verified: true
    bands:
      - {max_income: 750, grant: 60000}
      - {max_income: 1000, grant: 55000}
      - {max_income: 1250, grant: 52500}
      - {max_income: 1500, grant: 47500}
      - {max_income: 1750, grant: 45000}
      - {max_income: 2000, grant: 40000}
      - {max_income: 2250, grant: 35000}
      - {max_income: 2500, grant: 32500}
      - {max_income: 2750, grant: 27500}
      - {max_income: 3000, grant: 25000}
      - {max_income: 3250, grant: 20000}
      - {max_income: 3500, grant: 15000}
      - {max_income: 3750, grant: 12500}
      - {max_income: 4000, grant: 10000}
      - {max_income: 4250, grant: 5000}
      - {max_income: 4500, grant: 2500}

hdb_loan:
  interest_rate:
    value: 0.026
    note: "Concessionary rate: CPF OA rate (2.5%) + 0.1%, reviewed quarterly. Used for the actual instalment."
    source_url: "https://www.edgeprop.sg/property-news/guide-hdb-concessionary-housing-loan"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  assessment_rate_floor:
    value: 0.03
    effective_from: "2022-09-30"
    note: "HDB sizes the eligible loan (MSR limit) at the higher of this floor and the prevailing rate."
    source_url: "https://www.hdb.gov.sg/about-us/news-and-publications/press-releases/29092022-propertymeasures2022"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  ltv:
    value: 0.75
    effective_from: "2024-08-20"
    note: "Lowered from 80% for flat applications from the Oct 2024 sales exercise. Pro-rated only if the lease does not cover the youngest applicant to 95, which a new 99-year flat always does."
    source_url: "https://www.shopback.sg/blog/finance/hdb-vs-bank-loan"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  msr:
    value: 0.30
    note: "Mortgage Servicing Ratio: monthly instalment <= 30% of gross monthly household income."
    source_url: "https://www.shopback.sg/blog/finance/hdb-vs-bank-loan"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  max_tenure_years:
    value: 25
    source_url: "https://www.smartcalculator.sg/housing/mortgage-calculator"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  tenure_age_limit:
    value: 65
    note: "Repayment period is the shortest of 25 years, 65 minus the AVERAGE age of the applicants, and remaining lease minus 20 years. The lease cap cannot bind for a new 99-year flat, so it is not modelled. Fractional years are rounded down (assumption)."
    source_url: "https://www.hdb.gov.sg/buying-a-flat/flat-grant-and-loan-eligibility/housing-loan/housing-loan-from-hdb"
    confirmed_by: 'HDB "Housing Loan from HDB" page, Details on the HDB housing loan (last updated 23 Aug 2026; text checked 24 Oct 2026)'
    verified: true

# Bank (financial institution) loans for an HDB flat. MSR 30% also applies (hdb_loan.msr).
bank_loan:
  max_tenure_years:
    value: 30
    note: "Maximum tenure for a bank loan on an HDB flat."
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    confirmed_by: 'MAS explainer "Loan Tenure and Loan-to-Value Limits" (last updated 27 Mar 2024)'
    verified: true
  ltv:
    value: 0.75
    note: "First housing loan. HDB Annex B (Feb 2026) also states the FI LTV limit is 75%."
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    verified: true
  ltv_reduced:
    value: 0.55
    note: "Applies if the tenure exceeds 25 years (HDB flats) or the loan runs past age 65, using the income-weighted average age of joint borrowers."
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    verified: true
  ltv_tenure_threshold_years:
    value: 25
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    verified: true
  age_limit:
    value: 65
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    verified: true
  min_cash_downpayment:
    at_full_ltv: 0.05
    at_reduced_ltv: 0.10
    note: "Share of the price that must be paid in cash (not CPF): 5% at 75% LTV, 10% at 55% LTV."
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/loan-tenure-and-loan-to-value-limits"
    verified: true
  assessment_rate_floor:
    value: 0.04
    effective_from: "2022-09-30"
    note: "MAS medium-term interest rate floor used by banks to compute MSR/TDSR (higher of 4% or the actual rate)."
    source_url: "https://www.mas.gov.sg/news/media-releases/2022/measures-to-promote-sustainable-conditions-in-the-property-market-by-ensuring-prudent-borrowing-and-moderating-demand"
    verified: true
  tdsr:
    value: 0.55
    note: "Total Debt Servicing Ratio: all monthly debt repayments, including the new housing loan, at most 55% of gross monthly income. Applies to loans from financial institutions; HDB assesses other commitments in its own credit assessment."
    source_url: "https://www.mas.gov.sg/regulation/explainers/new-housing-loans/msr-and-tdsr-rules"
    verified: true
  indicative_rate:
    value: 0.016
    as_of: "2026-10-23"
    note: "Default for the bank-rate input only: market snapshot of advertised 2-year fixed packages (about 1.60-1.65%, 19 Oct 2026); lowest floating packages near 1.45% (23 Oct 2026). Rates change daily and depend on the bank's approval. Not an offer."
    source_url: "https://www.redbrick.sg/blog/best-home-loan-singapore/"
    verified: true

# When payments fall due for a new flat (percent of the flat price).
payment_stages:
  downpayment_at_signing:
    hdb_loan: 0.10
    bank_loan: 0.20
    deferred_income_assessment: 0.025
    note: "Paid at the Agreement for Lease signing, by CPF and/or cash; the option fee counts towards it. Eligible young couples under deferred income assessment pay 2.5%. The balance is due at key collection, when the HDB loan is disbursed."
    source_url: "https://www.hdb.gov.sg"
    confirmed_by: 'HDB Annex B, Administrative details for February 2026 BTO and SBF exercises, para 15 and footnotes 4-5; checked 24 Oct 2026'
    verified: true

# CPF contributions, for projecting the Ordinary Account forward ("what if we wait?").
# Monthly wages above $750, Ordinary Wages only (bonuses / Additional Wages ignored), Singapore Citizens.
cpf:
  ordinary_wage_ceiling:
    value: 8000
    effective_from: "2026-01-01"
    source_url: "https://www.cpf.gov.sg/content/dam/web/employer/employer-obligations/documents/CPFcontributionratesfrom1Jan2026.pdf"
    verified: true
  min_wage_full_rate:
    value: 750
    note: "Contribution rates below apply to monthly wages above this; lower wages are projected as no OA contributions (conservative)."
    source_url: "https://www.cpf.gov.sg/content/dam/web/employer/employer-obligations/documents/CPFcontributionratesfrom1Jan2026.pdf"
    verified: true
  contribution_and_allocation:
    note: "total_rate = employer + employee share of wages; oa_ratio = share of the contribution allocated to the Ordinary Account. From 1 Jan 2026, private sector employees."
    source_url: "https://www.cpf.gov.sg/content/dam/web/employer/employer-obligations/documents/CPFcontributionratesfrom1Jan2026.pdf"
    confirmed_by: 'CPF "Allocation Rates from 1 January 2026" (https://www.cpf.gov.sg/content/dam/web/employer/employer-obligations/documents/CPFAllocationRatesfromJanuary2026.pdf)'
    verified: true
    bands:
      - {max_age: 35, total_rate: 0.37, oa_ratio: 0.6217}
      - {max_age: 45, total_rate: 0.37, oa_ratio: 0.5677}
      - {max_age: 50, total_rate: 0.37, oa_ratio: 0.5136}
      - {max_age: 55, total_rate: 0.37, oa_ratio: 0.4055}
      - {max_age: 60, total_rate: 0.34, oa_ratio: 0.353}
      - {max_age: 65, total_rate: 0.25, oa_ratio: 0.14}
      - {max_age: 70, total_rate: 0.165, oa_ratio: 0.0607}
      - {max_age: null, total_rate: 0.125, oa_ratio: 0.08}
  oa_interest_rate:
    value: 0.025
    note: "Base OA interest. HDB states its loan rate (2.6%) is the OA rate + 0.1%. Extra interest on the first $60,000 is ignored (conservative)."
    source_url: "https://www.cpf.gov.sg"
    confirmed_by: 'HDB "Housing Loan from HDB" page: concessionary rate pegged at 0.1%-point above the prevailing CPF OA rate'
    verified: true

upfront:
  option_fee:
    note: "BTO option fee by flat type. Forms part of the downpayment."
    source_url: "https://www.hdb.gov.sg"
    confirmed_by: 'HDB Annex B, Administrative details for February 2026 BTO and SBF exercises, para 14; checked 24 Oct 2026'
    verified: true
    by_flat_type:
      2-room: 500
      3-room: 1000
      4-room: 2000
      5-room: 2000
      3gen: 2000
  buyer_stamp_duty:
    note: "IRAS residential BSD tiers (marginal). Tiers up to $1.5M (1/2/3/4%) confirmed on HDB's resale approval page (updated 18 Aug 2026), which covers every HDB price. Above $1.5M HDB lists 5% for the remainder; the 5%/6% split here follows IRAS and is not used for HDB flats."
    source_url: "https://www.iras.gov.sg"
    confirmed_by: 'HDB "Approval of Resale Flat Application for Buyers" page, Stamp duty (last updated 18 Aug 2026; text checked 24 Oct 2026)'
    verified_up_to: 1500000
    verified: true
    tiers:
      - {up_to: 180000, rate: 0.01}
      - {up_to: 360000, rate: 0.02}
      - {up_to: 1000000, rate: 0.03}
      - {up_to: 1500000, rate: 0.04}
      - {up_to: 3000000, rate: 0.05}
      - {up_to: null, rate: 0.06}
  mortgage_stamp_duty:
    rate: 0.004
    max: 500
    note: "Stamp duty on the mortgage: 0.40% of the loan granted, up to $500. Only if taking a housing loan."
    source_url: "https://www.hdb.gov.sg"
    confirmed_by: 'HDB "Approval of Resale Flat Application for Buyers" page, Stamp duty (last updated 18 Aug 2026; text checked 24 Oct 2026)'
    verified: true
  application_fee:
    value: 10
    note: "Non-refundable administrative fee per BTO application, inclusive of GST."
    source_url: "https://www.hdb.gov.sg"
    confirmed_by: 'HDB "Application for a New Flat" page (last updated 22 Oct 2026; text checked 24 Oct 2026)'
    verified: true
  legal_and_misc_estimate:
    value: 3000
    note: "Rough placeholder for conveyancing and misc fees. Users should replace with a quote."
    verified: false

